<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Search · Lemon Lens</title>
<meta name="description" content="Free, unlimited image search from multiple engines. Fast masonry gallery, filters, favorites.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="sheet">
<main>
  <section class="phero">
    <div class="wrap">
      <div class="eyebrow">Image search</div>
      <h1>Search every image, <br>instantly.</h1>
      <p>Free and unlimited. Results from several engines are merged, de-duplicated and ranked for relevance.</p>
      <form class="pill" id="form" autocomplete="off" style="max-width:640px">
        <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search images…" required maxlength="500" aria-label="Search images" enterkeyhint="search">
        <button class="btn" type="submit">Search</button>
      </form>
      <div class="filters">
        <label class="sel"><select id="imgsz" aria-label="Size"><option value="">Any size</option><option value="l">Large</option><option value="m">Medium</option><option value="i">Icon</option></select></label>
        <label class="sel"><select id="image_type" aria-label="Type"><option value="">Any type</option><option value="photo">Photo</option><option value="clipart">Clipart</option><option value="lineart">Line drawing</option><option value="animated">Animated GIF</option><option value="face">Face</option></select></label>
        <label class="sel"><select id="image_color" aria-label="Color"><option value="">Any color</option><option value="color">Full color</option><option value="gray">Black &amp; white</option></select></label>
        <label class="sel"><select id="safe" aria-label="Safe search"><option value="">Safe: moderate</option><option value="active">Safe: strict</option><option value="off">Safe: off</option></select></label>
        <span class="tabs" id="tabs"><button type="button" class="on" data-t="search">Results</button><button type="button" data-t="saved">Saved <span id="favn"></span></button></span>
      </div>
    </div>
  </section>
  <section class="results"><div class="wrap">
    <div class="chips" id="hist" style="margin:0 0 16px"></div>
    <div class="related" id="related"></div>
    <div class="bar"><div id="status" role="status"></div><a class="link-arrow" href="/agent">Can't find it? Ask the AI agent <b>&rarr;</b></a></div>
    <div class="gallery" id="gallery" aria-live="polite"></div>
    <div class="sentinel" id="sentinel"></div>
    <div class="center" style="margin-top:22px"><button class="btn ghost" id="more" hidden>Load more</button></div>
  </div></section>
</main>
</div>
<script src="/vendor/lottie.min.js"></script>
<script src="/common.js"></script>
<script src="/gallery.js"></script>
<script src="/images.js"></script>
</body>
</html>
